name: Test CENTRAL IA AI chat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ai-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Send authenticated message to CENTRAL IA
        env:
          CENTRAL_IA_API_TOKEN: ${{ secrets.CENTRAL_IA_API_TOKEN }}
        run: |
          set +x
          if [ -z "$CENTRAL_IA_API_TOKEN" ]; then
            echo "Secret CENTRAL_IA_API_TOKEN is missing."
            exit 1
          fi
          status=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${CENTRAL_IA_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"message":"Responda em português, de forma breve: CENTRAL IA, você está funcionando?"}' \
            "https://central-ia-worker.adryanruan2207.workers.dev/ai/chat")
          echo "HTTP status: $status"
          cat response.json
          test "$status" = "200"
