name: Test CENTRAL IA API authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test authenticated tasks endpoint
        env:
          CENTRAL_IA_API_TOKEN: ${{ secrets.CENTRAL_IA_API_TOKEN }}
        run: |
          set +x
          if [ -z "$CENTRAL_IA_API_TOKEN" ]; then
            echo "Secret CENTRAL_IA_API_TOKEN is missing."
            exit 1
          fi
          status=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CENTRAL_IA_API_TOKEN}" \
            "https://central-ia-worker.adryanruan2207.workers.dev/tasks")
          echo "HTTP status: $status"
          cat response.json
          test "$status" = "200"
