name: Deploy CENTRAL IA Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "tests/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run static safety tests
        run: node --test tests/*.test.mjs

      - name: Validate Wrangler TOML configuration
        run: |
          python - <<'PY'
          import pathlib, tomllib
          config = tomllib.loads(pathlib.Path("worker/wrangler.toml").read_text())
          assert config.get("name") == "central-ia-worker", "Worker name mismatch"
          assert config.get("main") == "src/index.js", "Worker entrypoint mismatch"
          assert config.get("compatibility_date") == "2026-11-19", "Compatibility date mismatch"
          assert any(x.get("binding") == "DB" and x.get("database_name") == "central-ia-db" for x in config.get("d1_databases", [])), "D1 binding missing"
          assert config.get("ai", {}).get("binding") == "AI", "Workers AI binding missing"
          print("Wrangler TOML valid; required bindings present.")
          PY

      - name: Install Wrangler for validation
        run: npm install --global wrangler

      - name: Compile Worker without deployment
        working-directory: worker
        run: wrangler deploy --dry-run --outdir /tmp/central-ia-production-check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Apply D1 migrations
        working-directory: worker
        run: wrangler d1 migrations apply central-ia-db --remote

      - name: Deploy Worker
        working-directory: worker
        run: wrangler deploy
