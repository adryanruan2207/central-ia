name: CENTRAL IA Safety Tests

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "index.html"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run static safety tests
        run: node --test tests/*.test.mjs
